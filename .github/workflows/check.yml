# The catalogue's gate (scripts/check.mjs) and its own tests (test.sh).
name: check
on:
  push:
    branches: [stage, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: catalogue, pointers and links
        run: node scripts/check.mjs --remote --online ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}
      - run: ./test.sh
