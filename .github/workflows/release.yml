# On a tag v*: build dist/ (agent-skills layout, claude.ai zips, manifest) and
# attach it to the release. Upload to claude.ai stays a person's step.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/check.mjs --remote
      - run: node scripts/build-dist.mjs --out dist
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && tar -czf ../agents-skills.tar.gz agents manifest.json)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Skills as of $TAG. manifest.json carries each skill's sha256 and source commit." \
            agents-skills.tar.gz dist/manifest.json dist/claude-ai/*.zip
